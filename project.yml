name: InsulinPumpSiteJournal
options:
  bundleIdPrefix: io.github.0xa10
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    # Apple-generic versioning so fastlane (increment_build_number/agvtool)
    # can bump the build number per TestFlight upload.
    VERSIONING_SYSTEM: apple-generic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0.2"
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: KYL2A4S3H4
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"

targets:
  InsulinPumpSiteJournal:
    type: application
    platform: iOS
    sources:
      - path: InsulinPumpSiteJournal
        excludes: ["*.entitlements"]
    # XcodeGen generates this file on every `xcodegen generate` — the
    # properties here are the source of truth, not the .entitlements file.
    entitlements:
      path: InsulinPumpSiteJournal/InsulinPumpSiteJournal.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.io.github.0xa10.InsulinPumpSiteJournal
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.0xa10.InsulinPumpSiteJournal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ENABLE_PREVIEWS: "YES"
    info:
      path: InsulinPumpSiteJournal/Info.plist
      properties:
        CFBundleDisplayName: Rotate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Portrait-only apps must opt out of iPad multitasking or App Store
        # validation rejects the upload (ITMS-90474).
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # Loop registers the loop:// scheme; declaring it lets the handoff
        # check canOpenURL and open Loop after a placement is confirmed.
        LSApplicationQueriesSchemes: [loop]
        # CloudKit pushes a silent notification when another device writes;
        # this lets the mirror pull those changes in the background.
        UIBackgroundModes: [remote-notification]

  InsulinPumpSiteJournalTests:
    type: bundle.unit-test
    platform: iOS
    sources: [InsulinPumpSiteJournalTests]
    dependencies:
      - target: InsulinPumpSiteJournal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.0xa10.InsulinPumpSiteJournalTests
        GENERATE_INFOPLIST_FILE: "YES"

  InsulinPumpSiteJournalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [InsulinPumpSiteJournalUITests]
    dependencies:
      - target: InsulinPumpSiteJournal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.0xa10.InsulinPumpSiteJournalUITests
        GENERATE_INFOPLIST_FILE: "YES"
        # XCTestCase overrides nonisolated inits; MainActor default isolation breaks the subclass.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  InsulinPumpSiteJournal:
    build:
      targets:
        InsulinPumpSiteJournal: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - InsulinPumpSiteJournalTests
        # The screenshot walk is visual QA, not a functional test — it runs
        # in the VisualWalk scheme so default test runs stay fast.
        - name: InsulinPumpSiteJournalUITests
          skippedTests: [ScreenshotWalkUITests]

  VisualWalk:
    build:
      targets:
        InsulinPumpSiteJournal: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: InsulinPumpSiteJournalUITests
          selectedTests: [ScreenshotWalkUITests]
