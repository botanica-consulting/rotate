name: InsulinPumpSiteJournal
options:
  bundleIdPrefix: consulting.botanica
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    # Apple-generic versioning so fastlane (increment_build_number/agvtool)
    # can bump the build number per TestFlight upload.
    VERSIONING_SYSTEM: apple-generic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.1.1"
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: KYL2A4S3H4
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"

targets:
  InsulinPumpSiteJournal:
    type: application
    platform: iOS
    sources:
      - path: InsulinPumpSiteJournal
        excludes: ["*.entitlements"]
      # Compiled into the widget extension too — see the RotateWidget target.
      - path: Shared
    # XcodeGen generates this file on every `xcodegen generate` — the
    # properties here are the source of truth, not the .entitlements file.
    entitlements:
      path: InsulinPumpSiteJournal/InsulinPumpSiteJournal.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.consulting.botanica.rotate
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
        # Shared with the widget extension: the widget can't open the SwiftData
        # store (app container, CloudKit-mirrored), so the app publishes a small
        # snapshot into this group instead.
        com.apple.security.application-groups:
          - group.consulting.botanica.rotate
    dependencies:
      - target: RotateWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: consulting.botanica.rotate
        # iPhone only. Must be set at the TARGET level — the project-level
        # value gets overridden to "1,2" (universal), which made Apple demand
        # iPad screenshots and throw ITMS-90474. Target-level wins.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ENABLE_PREVIEWS: "YES"
    info:
      path: InsulinPumpSiteJournal/Info.plist
      properties:
        CFBundleDisplayName: Rotate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Required by App Store upload validation (ITMS-90474). A portrait-only
        # app without this key is treated as iPad-multitasking-capable and the
        # upload is REJECTED unless all four orientations are listed — this
        # fired on the 1.1.0 upload even though the app is iPhone-only
        # (TARGETED_DEVICE_FAMILY 1). iOS 26 flags it deprecated at build time,
        # but the validator still requires it for a portrait-only app, so keep
        # it until Apple actually stops accepting it.
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # Shown in the Face ID system prompt when the journal is locked. Required
        # whenever LocalAuthentication can reach biometrics — without it the
        # evaluate call fails outright rather than prompting.
        NSFaceIDUsageDescription: Unlocks your journal so only you can open it.
        # Loop registers the loop:// scheme; declaring it lets the handoff
        # check canOpenURL and open Loop after a placement is confirmed.
        LSApplicationQueriesSchemes: [loop]
        # Our own scheme, so a widget tap can open the new-placement flow
        # (rotate://new?device=pump — see Shared/DeepLink.swift).
        CFBundleURLTypes:
          - CFBundleURLName: consulting.botanica.rotate
            CFBundleTypeRole: Editor
            CFBundleURLSchemes: [rotate]
        # CloudKit pushes a silent notification when another device writes;
        # this lets the mirror pull those changes in the background.
        UIBackgroundModes: [remote-notification]

  # Lock-screen (and home-screen) readout of how long the current site has been
  # on. It reads the snapshot the app writes to the shared App Group rather than
  # the SwiftData store, so it needs neither the store's URL nor CloudKit.
  RotateWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: RotateWidget
      - path: Shared
      # The only two app files the widget needs: the track enum and the palette.
      # AppTheme's tier colors live in AppTheme+Recency.swift precisely so this
      # doesn't drag the SwiftData layer into the extension.
      - path: InsulinPumpSiteJournal/Models/DeviceType.swift
      - path: InsulinPumpSiteJournal/Design/AppTheme.swift
    entitlements:
      path: RotateWidget/RotateWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.consulting.botanica.rotate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: consulting.botanica.rotate.widget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: "YES"
    info:
      path: RotateWidget/Info.plist
      properties:
        CFBundleDisplayName: Rotate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  InsulinPumpSiteJournalTests:
    type: bundle.unit-test
    platform: iOS
    sources: [InsulinPumpSiteJournalTests]
    dependencies:
      - target: InsulinPumpSiteJournal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: consulting.botanica.rotate.tests
        GENERATE_INFOPLIST_FILE: "YES"

  InsulinPumpSiteJournalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [InsulinPumpSiteJournalUITests]
    dependencies:
      - target: InsulinPumpSiteJournal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: consulting.botanica.rotate.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        # XCTestCase overrides nonisolated inits; MainActor default isolation breaks the subclass.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  InsulinPumpSiteJournal:
    build:
      targets:
        InsulinPumpSiteJournal: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - InsulinPumpSiteJournalTests
        # The screenshot walk is visual QA, not a functional test — it runs
        # in the VisualWalk scheme so default test runs stay fast.
        - name: InsulinPumpSiteJournalUITests
          skippedTests: [ScreenshotWalkUITests, AppStoreScreenshotsUITests, WizardShotUITests]

  VisualWalk:
    build:
      targets:
        InsulinPumpSiteJournal: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: InsulinPumpSiteJournalUITests
          selectedTests: [ScreenshotWalkUITests]

  # Drives fastlane `snapshot` (see fastlane/Snapfile) — App Store marketing
  # screenshots only, so it stays out of the default test plan.
  Screenshots:
    build:
      targets:
        InsulinPumpSiteJournal: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: InsulinPumpSiteJournalUITests
          selectedTests: [AppStoreScreenshotsUITests]
