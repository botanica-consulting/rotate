name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    # Needs an image with the Xcode 26 / iOS 26 SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build & test
        run: |
          xcodebuild \
            -project InsulinPumpSiteJournal.xcodeproj \
            -scheme InsulinPumpSiteJournal \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            clean test
